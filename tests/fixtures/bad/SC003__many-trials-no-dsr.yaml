# Must fail with SC003: 20 trials but no deflated Sharpe ratio.
schema_version: '0.1'
strategy:
  name: Test strategy
  description: A clean card used as a test baseline.
test_window:
  in_sample:
    start: '2010-01-04'
    end: '2017-12-29'
  out_of_sample:
    start: '2018-01-02'
    end: '2020-12-31'
costs:
  fees_bps: 1.0
  slippage_bps: 2.0
  model: per side, on traded notional
trials:
  count: 20
  log: trials.csv
performance:
  periods_per_year: 252
  sharpe:
    in_sample: 1.2
    out_of_sample: 0.9
data:
  point_in_time: as_reported
  survivorship:
    handling: includes_delisted
    notes: delisted names kept
  sources:
  - name: Synthetic
    license: CC0
